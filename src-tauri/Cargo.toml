[package]
name = "dwo"
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "dwo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["image-png", "unstable", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
native-tls = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"
zip = "0.6"
walkdir = "2"
regex = "1"
tempfile = "3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
async-channel = "2"
once_cell = "1"
notify = "6"
objc2 = { version = "0.6", features = ["exception"] }

# DWO patch: tao 0.35.3 crashes on macOS 26 (Tahoe) at launch — an NSException
# inside applicationDidFinishLaunching unwinds through the extern "C" delegate
# and aborts (tauri-apps/tao#1171). Vendored copy catches the exception and uses
# the modern activate: API. Remove once a fixed tao ships.
[patch.crates-io]
tao = { path = "vendor/tao" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "unwind"

[profile.dev]
panic = "unwind"
