apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: dwo-prod

bases:
  - ../../base

namespace: dwo-prod

patches:
  - target:
      kind: Deployment
      name: dwo
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/kennethaman/dwo:latest
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DWO_DATA_DIR
          value: "/data"
