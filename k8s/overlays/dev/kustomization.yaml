apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: dwo-dev

bases:
  - ../../base

namespace: dwo-dev

patches:
  - target:
      kind: Deployment
      name: dwo
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/kennethaman/dwo:dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_ENV
          value: development

  - target:
      kind: PersistentVolumeClaim
      name: dwo-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
